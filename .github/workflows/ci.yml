name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ preproduction, main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: flake8 . --count --show-source --statistics

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Build (vérifier que l'appli s'exécute)
        run: python -m app.main

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/preproduction'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy (simulation vers préproduction)
        run: echo "Déploiement simulé vers l'environnement de préproduction"